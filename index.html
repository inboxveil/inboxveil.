<html lang="en">
<head>
<meta charset="UTF-8">

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>QuickMail - Temporary Email</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{

button,

/* ================= HEADER ================= */

.header{
    position:sticky;
    top:0;
    z-index:50;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:16px 18px;

    background:#10182a;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:40px;
    height:40px;
    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,#00d4a8,#168cff);

    font-size:20px;
    font-weight:800;
}

.logo-text{
    font-size:19px;
    font-weight:800;
}

.logo-sub{
    color:#7f8aa3;
    font-size:11px;
    margin-top:2px;
}

.refresh-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:12px;

    background:#18233a;
    color:#fff;

    font-size:20px;
}

.refresh-btn:active{
    transform:scale(.94);
}

/* ================= MAIN ================= */

.main{
    padding:18px;
}

/* ================= MAILBOX CARD ================= */

.mailbox-card{
    background:
        linear-gradient(
            145deg,
            rgba(0,212,168,.13),
            rgba(22,140,255,.08)
        );

    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;

    padding:18px;

    box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.small-label{
    color:#8490a9;
    font-size:12px;
    margin-bottom:8px;
}

.email-row{
    display:flex;
    align-items:center;
    gap:8px;
}

.email-address{
    flex:1;

    min-width:0;

    color:#fff;
    font-size:18px;
    font-weight:700;

    word-break:break-all;
}

.copy-btn{
    flex-shrink:0;

    border:none;
    border-radius:10px;

    background:#1c2941;
    color:#fff;

    padding:10px 12px;

    font-size:13px;
}

.copy-btn:hover{
    background:#243554;
}

.mailbox-info{
    display:flex;
    justify-content:space-between;

    margin-top:15px;

    color:#7f8aa3;
    font-size:12px;
}

/* ================= ACTIONS ================= */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-top:14px;
}

.action-btn{
    min-height:48px;

    border:none;
    border-radius:13px;

    color:#fff;
    font-weight:700;

}

.action-btn.primary{

}

.action-btn.danger{
    background:#351b27;
    color:#ff8ca8;
}

.action-btn:active{
    transform:scale(.98);
}

/* ================= STATUS ================= */

.status{
    display:none;

    margin-top:12px;

    padding:12px 14px;

    border-radius:12px;

    background:#131e32;

    color:#aab5ca;

    font-size:13px;
    line-height:1.5;
}

.status.show{
    display:block;
}

.status.success{
    color:#58e7be;
}

.status.error{
    color:#ff7f99;
}

/* ================= INBOX ================= */

.inbox-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:25px;
    margin-bottom:12px;
}

.inbox-title{
    display:flex;
    align-items:center;
    gap:8px;

    font-size:18px;
    font-weight:800;
}

.badge{
    min-width:23px;
    height:23px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 7px;

    border-radius:20px;

    background:#00cda4;
    color:#03130f;

    font-size:11px;
    font-weight:900;
}

.inbox-tools{
    display:flex;
    gap:8px;
}

.tool-btn{
    border:none;
    border-radius:9px;

    background:#17233a;
    color:#d7deeb;

    padding:8px 10px;

    font-size:12px;
}

/* ================= EMAIL LIST ================= */

.email-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.email-item{
    width:100%;

    padding:15px;

    border-radius:15px;

    background:#10192b;
    border:1px solid rgba(255,255,255,.05);

    transition:.15s;
}

.email-item:active{
    transform:scale(.99);
}

.email-item.unread{
    background:#12263a;
    border-color:rgba(0,205,164,.22);
}

.email-top{
    display:flex;
    justify-content:space-between;
    gap:12px;
}

.email-from{
    min-width:0;

    font-size:14px;
    font-weight:800;

    text-overflow:ellipsis;
    white-space:nowrap;
}

.email-time{
    flex-shrink:0;

    color:#68758e;
    font-size:10px;
}

.email-subject{
    margin-top:7px;

    font-size:13px;
    font-weight:600;
}

.email-intro{
    margin-top:6px;

    color:#78859d;

    font-size:12px;
    line-height:1.45;

    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
}

.email-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    display:inline-block;

}

/* ================= EMPTY ================= */

.empty{

    color:#65728b;
}

.empty-icon{
    font-size:42px;
    margin-bottom:12px;
}

.empty-title{
    color:#cbd3e1;
    font-size:15px;
    font-weight:700;
}

.empty-text{
    margin-top:6px;

    font-size:12px;
    line-height:1.5;
}

/* ================= LOADER ================= */

.loader{
    width:25px;
    height:25px;

    margin:20px auto;

    border:3px solid rgba(255,255,255,.12);
    border-top-color:#00d4a8;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;

    z-index:100;

    display:none;
    align-items:flex-end;
    justify-content:center;

    background:rgba(0,0,0,.72);
    backdrop-filter:blur(5px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:900px;

    max-height:90vh;
    overflow:auto;

    background:#10182a;

    border-radius:22px 22px 0 0;

    padding:20px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-bottom:18px;
}

.modal-title{
    font-size:18px;
    font-weight:800;
}

.close-btn{
    width:38px;
    height:38px;

    border:none;
    border-radius:50%;

    background:#1b2840;
    color:#fff;

    font-size:18px;
}

/* ================= MESSAGE ================= */

.message-meta{
    padding:14px;

    border-radius:14px;

    background:#0b1220;
}

.meta-row{
    display:flex;

    gap:10px;

    margin-bottom:9px;
}

.meta-label{
    width:65px;

    flex-shrink:0;

    color:#68758e;

    font-size:11px;
}

.meta-value{
    flex:1;

    color:#d9dfeb;

    font-size:12px;

    word-break:break-word;
}

.message-body{
    margin-top:14px;

    padding:16px;

    border-radius:15px;

    background:#0b1220;

    color:#dce3ef;

    font-size:14px;
    line-height:1.65;

    white-space:pre-wrap;
    word-break:break-word;
}

.message-actions{
    display:flex;
    gap:8px;

    margin-top:14px;
}

.message-actions button{
    flex:1;

    min-height:44px;

    border:none;
    border-radius:11px;

    background:#1b2941;
    color:#fff;
}

/* ================= CREATE MODAL ================= */

.form-group{
    margin-bottom:15px;
}

.form-label{
    display:block;

    color:#8793aa;

    font-size:12px;

    margin-bottom:7px;
}

.form-input,
.form-select{
    width:100%;

    min-height:48px;

    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;

    background:#0b1220;

    color:#fff;

    padding:0 13px;

    outline:none;
}

.form-input:focus,
.form-select:focus{
    border-color:#00cda4;
}

.create-btn{

    min-height:50px;

    border:none;
    border-radius:13px;

    color:#fff;

}

.password-row{

}

.password-row .form-input{

.generate-btn{
    border:none;
    border-radius:11px;

/* ================= FOOTER ================= */

.footer{

    line-height:1.6;

/* ================= DESKTOP ================= */

@media(min-width:700px){

        max-width:650px;
    }
}
</style>

<script>
/* =========================================================
   QUICKMAIL
   MAIL.TM API CLIENT
========================================================= */

const API = "https://api.mail.tm";

let domains = [];

let currentAccount = {
    id: null,
    address: null,
    password: null,
    token: null
};

let messages = [];

let refreshInterval = null;

let countdown = 10;


/* =========================================================
   DOM HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(message, type = ""){

    const el = $("status");

    el.textContent = message;

    el.className = "status show " + type;
}

function hideStatus(){

    $("status").className = "status";
}


/* =========================================================
   API REQUEST
========================================================= */

async function apiFetch(
    endpoint,
    options = {},
    requiresAuth = false
){

    const headers = {
        "Accept": "application/json",
        ...(options.headers || {})
    };

    if(requiresAuth){

        if(!currentAccount.token){
            throw new Error("Authentication token is missing.");
        }

        headers["Authorization"] =
            "Bearer " + currentAccount.token;
    }

    const response = await fetch(
        API + endpoint,
        {
            ...options,
            headers
        }
    );

    let data = null;

    const contentType =
        response.headers.get("content-type") || "";

    if(
        contentType.includes("application/json") ||
        contentType.includes("application/ld+json")
    ){
        try{
            data = await response.json();
        }catch(e){
            data = null;
        }
    }

    if(!response.ok){

        let message =
            `Request failed (${response.status})`;

        if(data){

            if(data.detail){
                message = data.detail;
            }
            else if(data.message){
                message = data.message;
            }
        }

        throw new Error(message);
    }

    return data;
}


/* =========================================================
   LOAD DOMAINS
========================================================= */

async function loadDomains(){

    const select = $("domainSelect");

    select.innerHTML = `
        <option value="">
            Loading domains...
        </option>
    `;

    try{

        /*
         * Mail.tm exposes domains without authentication.
         */

        const data =
            await apiFetch("/domains?page=1");

        console.log("Mail.tm domain response:", data);

        const list =
            Array.isArray(data["hydra:member"])
                ? data["hydra:member"]
                : [];

        domains =
            list.filter(domain =>
                domain &&
                domain.domain &&
                domain.isActive === true
            );

        if(domains.length === 0){

            throw new Error(
                "Mail.tm returned no active domains."
            );
        }

        select.innerHTML = "";

        domains.forEach(domain => {

            const option =
                document.createElement("option");

            option.value = domain.domain;

            option.textContent =
                "@" + domain.domain;

            select.appendChild(option);

        });

        console.log(
            "Loaded domains:",
            domains.map(d => d.domain)
        );

    }
    catch(error){

        console.error(
            "Domain loading error:",
            error
        );

        select.innerHTML = `
            <option value="">
                Could not load domains
            </option>
        `;

        /*
         * Retry once after a short delay.
         */
        setTimeout(() => {

            if(domains.length === 0){
                loadDomains();
            }

        }, 5000);
    }
}
