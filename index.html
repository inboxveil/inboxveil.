<!DOCTYPE html>
<html>
<head>
  <title>InboxVeil - Disposable Email</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#05050F;color:white;font-family:Segoe UI,sans-serif;padding:20px}
    h1{text-align:center;background:linear-gradient(90deg,#8B5CF6,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px}
   .box{background:rgba(15,15,30,0.8);border:1px solid #8B5CF6;border-radius:20px;padding:25px}
   .row{display:flex;gap:10px;margin-bottom:15px}
   .input{background:#0A0A1A;border:1px solid #8B5CF6;padding:14px;border-radius:12px;color:white;width:100%;font-size:16px}
   .domain{background:#0A0A1A;border:1px solid #8B5CF6;padding:14px;border-radius:12px;color:#A78BFA;font-weight:bold}
   .btn{background:linear-gradient(90deg,#8B5CF6,#EC4899);border:none;padding:14px;border-radius:12px;color:white;font-weight:bold;width:100%;margin:8px 0;cursor:pointer;font-size:16px}
   .email{background:#0A0A1A;border:1px dashed #8B5CF6;padding:15px;border-radius:12px;display:flex;justify-content:space-between;margin:15px 0}
   .mail{background:#0A0A1A;padding:15px;border-radius:10px;margin:10px 0;border-left:3px solid #EC4899}
   .mail-body{background:#000;padding:12px;border-radius:8px;margin-top:10px;white-space:pre-wrap;word-break:break-all;font-size:13px}
   .status{text-align:center;padding:10px;color:#4ADE80}
   .loading{text-align:center;padding:10px;color:#A78BFA}
  </style>
</head>
<body>
  <h1>InboxVeil</h1>
  <div class="box">
    <div class="row">
      <input id="name" class="input" placeholder="type name: facebook123">
      <div class="domain">@catchmail.io</div>
    </div>
    <button class="btn" onclick="gen()">Generate Email</button>
    <div class="email">
      <span id="email">email go show here</span>
      <span onclick="copy()" style="color:#EC4899;cursor:pointer">Copy</span>
    </div>
    <button class="btn" id="ref" onclick="check()">Refresh Inbox 🔄</button>
    <div id="status"></div>
    <div id="inbox"><div style="text-align:center;color:#888">No emails yet</div></div>
  </div>

<script>
let addr = localStorage.getItem('iv_addr') || '';
const PROXY = 'https://corsproxy.io/?'; // This bypass CORS
const API = 'https://api.catchmail.io/api/v1';

if(addr){
  document.getElementById('email').innerText = addr;
  document.getElementById('name').value = addr.split('@')[0];
  check();
}

function gen(){
  let n = document.getElementById('name').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!n){alert('Type a name first');return;}
  addr = n + '@catchmail.io';
  localStorage.setItem('iv_addr', addr);
  document.getElementById('email').innerText = addr;
  document.getElementById('status').innerHTML = '<div class="status">✓ Email ready!</div>';
  check();
}

async function api(url){
  // Use proxy to bypass CORS
  let res = await fetch(PROXY + encodeURIComponent(url));
  return res.json();
}

async function check(){
  if(!addr){alert('Generate email first');return;}
  document.getElementById('ref').innerText = 'Refreshing...';
  document.getElementById('status').innerHTML = '<div class="loading">Checking for emails...</div>';
  try{
    let data = await api(`${API}/mailbox?address=${addr}`);
    let msgs = data.messages || [];
    if(msgs.length==0){
      document.getElementById('inbox').innerHTML = '<div style="text-align:center;color:#888">No emails yet. Wait 15s and refresh</div>';
    }else{
      let html = '';
      for(let m of msgs){
        // FIXED: Use backticks ` not ' '
        let detail = await api(`${API}/message/${m.id}?mailbox=${addr}`);
        html += `<div class="mail">
          <b>From:</b> ${detail.from}<br>
          <b>Subject:</b> ${detail.subject}<br>
          <b>Time:</b> ${new Date(detail.date).toLocaleString()}<br>
          <div class="mail-body">${detail.body.text || detail.body.html}</div>
        </div>`;
      }
      document.getElementById('inbox').innerHTML = html;
      document.getElementById('status').innerHTML = '';
    }
  }catch(e){
    document.getElementById('status').innerHTML = '<div style="color:red">Error: '+e.message+'. Try refresh</div>';
  }
  document.getElementById('ref').innerText = 'Refresh Inbox 🔄';
}

function copy(){
  if(addr)navigator.clipboard.writeText(addr);
}
</script>
</body>
</html>
