<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InboxVeil - Temporary Email</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070b14;--card:#10182a;--card2:#131e32;--border:rgba(255,255,255,.08);--text:#fff;--muted:#8290a8;--primary:#00cda4;--primary2:#078cf0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{cursor:pointer;font:inherit}
.app{width:100%;max-width:900px;min-height:100vh;margin:auto;background:#0b1020}
.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:15px 18px;background:#10182a;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;font-size:21px;font-weight:900}
.brand-name{font-size:19px;font-weight:800}.brand-sub{margin-top:2px;color:var(--muted);font-size:11px}
.refresh-top{width:42px;height:42px;border:0;border-radius:12px;background:#18243b;color:white;font-size:21px}
.main{padding:18px}
.mailbox{padding:18px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,rgba(0,205,164,.12),rgba(7,140,240,.07))}
.label{margin-bottom:8px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.5px}
.address-row{display:flex;align-items:center;gap:8px}
.address{flex:1;min-width:0;font-size:16px;font-weight:800;word-break:break-all}
.copy{flex-shrink:0;border:0;border-radius:10px;padding:10px 12px;background:#1b2941;color:white;font-size:12px;font-weight:700}
.mailbox-status{display:flex;justify-content:space-between;gap:10px;margin-top:14px;color:var(--muted);font-size:11px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.action{min-height:48px;border:0;border-radius:12px;background:#17233a;color:white;font-size:13px;font-weight:700}
.action.primary{background:linear-gradient(135deg,var(--primary),var(--primary2))}
.action.danger{background:#321b28;color:#ff8da7}
.status{display:none;margin-top:12px;padding:11px 13px;border-radius:11px;background:var(--card2);font-size:12px}
.status.show{display:block}.status.success{color:#57e8bd}.status.error{color:#ff829c}
.inbox-header{display:flex;align-items:center;justify-content:space-between;margin-top:25px;margin-bottom:12px}
.inbox-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800}
.badge{min-width:23px;height:23px;display:flex;align-items:center;justify-content:center;padding:0 7px;border-radius:20px;background:var(--primary);color:#001710;font-size:11px;font-weight:900}
.refresh-small{border:0;border-radius:9px;padding:8px 11px;background:#17233a;color:#d8e0ed;font-size:12px}
.email-list{display:flex;flex-direction:column;gap:8px}
.email{padding:15px;border:1px solid rgba(255,255,255,.05);border-radius:15px;background:#10192b;cursor:pointer}
.email.unread{border-color:rgba(0,205,164,.2);background:#12263a}
.email-top{display:flex;justify-content:space-between;gap:10px}
.sender{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;font-weight:800}
.date{flex-shrink:0;color:#68758e;font-size:10px}
.subject{margin-top:7px;color:#e0e6ef;font-size:13px;font-weight:700}
.preview{margin-top:6px;color:#75839c;font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unread-dot{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--primary)}
.empty{padding:55px 20px;text-align:center;color:#64728a}
.empty-icon{margin-bottom:12px;font-size:42px}.empty-title{color:#cbd4e2;font-size:15px;font-weight:700}.empty-text{max-width:400px;margin:7px auto 0;font-size:12px;line-height:1.55}
.loader{width:28px;height:28px;margin:0 auto 14px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--primary);border-radius:50%;animation:spin.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(5px)}
.modal.show{display:flex}
.modal-box{width:100%;max-width:900px;max-height:92vh;overflow-y:auto;padding:20px;border-radius:22px 22px 0 0;background:#10182a}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:18px;font-weight:800}
.close{width:38px;height:38px;border:0;border-radius:50%;background:#1b2840;color:white;font-size:19px}
.message-meta{padding:14px;border-radius:14px;background:#0b1220}
.meta{display:flex;gap:10px;margin-bottom:10px}.meta-label{width:55px;flex-shrink:0;color:#69758c;font-size:11px}.meta-value{flex:1;color:#dce3ef;font-size:12px;word-break:break-word}
.message-body{margin-top:14px;padding:16px;border-radius:15px;background:#0b1220;color:#dce3ef;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.message-buttons{display:flex;gap:8px;margin-top:14px}.message-buttons button{flex:1;min-height:44px;border:0;border-radius:11px;background:#1b2941;color:white}
.footer{padding:25px 18px 35px;text-align:center;color:#59657d;font-size:10px;line-height:1.6}
@media(min-width:700px){body{padding:20px}.app{min-height:calc(100vh - 40px);border-radius:24px;overflow:hidden}.modal{align-items:center}.modal-box{max-width:650px;border-radius:22px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="brand"><div class="logo">@</div><div><div class="brand-name">InboxVeil</div><div class="brand-sub">Free temporary email</div></div></div>
<button class="refresh-top" onclick="refreshInbox()">↻</button>
</header>
<main class="main">
<section class="mailbox">
<div class="label">YOUR TEMPORARY EMAIL</div>
<div class="address-row"><div id="address" class="address">Creating email...</div><button class="copy" onclick="copyAddress()">Copy</button></div>
<div class="mailbox-status"><span id="accountStatus">Starting...</span><span id="timer">Auto refresh: 10s</span></div>
<div class="actions">
<button class="action primary" onclick="newEmail()">+ New Email</button>
<button class="action" onclick="copyAddress()">Copy</button>
<button class="action" onclick="refreshInbox()">Refresh</button>
<button class="action danger" onclick="clearMailbox()">Clear</button>
</div>
<div id="status" class="status"></div>
</section>
<section>
<div class="inbox-header"><div class="inbox-title">Inbox <span id="unread" class="badge">0</span></div><button class="refresh-small" onclick="refreshInbox()">Refresh</button></div>
<div id="emailList" class="email-list"></div>
</section>
</main>
</div>
<div id="messageModal" class="modal" onclick="if(event.target==this)closeMessage()">
<div class="modal-box">
<div class="modal-header"><div id="messageTitle" class="modal-title">Email</div><button class="close" onclick="closeMessage()">×</button></div>
<div id="messageContent"></div>
</div>
</div>
<script>
const API = "https://api.mail.tm";
let mailbox = null;
let token = null;
let password = null;
let messages = [];
let refreshTimer = null;
let seconds = 10;
function $(id){return document.getElementById(id)}
function escapeHTML(v){if(v==null)return"";return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function showStatus(t,type="info"){const b=$("status");b.textContent=t;b.className="status show "+type;setTimeout(()=>{b.className="status"},3000)}
function randStr(len){const c="abcdefghijklmnopqrstuvwxyz0123456789";let s="";for(let i=0;i<len;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}

async function getDomain(){
  const res = await fetch(API+"/domains");
  const data = await res.json();
  return data["hydra:member"][0].domain;
}

async function createAccount(){
  const domain = await getDomain();
  const local = randStr(10);
  const address = local+"@"+domain;
  const pass = randStr(12)+"A1!";
  const res = await fetch(API+"/accounts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({address,password:pass})});
  if(!res.ok) throw new Error("Could not create account");
  const tokenRes = await fetch(API+"/token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({address,password:pass})});
  const tokenData = await tokenRes.json();
  mailbox=address; password=pass; token=tokenData.token;
  localStorage.setItem("mailtm_address",address);
  localStorage.setItem("mailtm_password",pass);
  localStorage.setItem("mailtm_token",token);
  return address;
}

async function initialize(){
  const savedAddr = localStorage.getItem("mailtm_address");
  const savedPass = localStorage.getItem("mailtm_password");
  const savedToken = localStorage.getItem("mailtm_token");
  if(savedAddr && savedPass && savedToken){
    mailbox=savedAddr; password=savedPass; token=savedToken;
    $("address").textContent=mailbox;
    $("accountStatus").textContent="Mailbox ready";
    $("accountStatus").style.color="#57e8bd";
    // verify token still valid
    try{ await refreshInbox(); }catch{ await newEmail(); }
  }else{
    await newEmail();
  }
  startAutoRefresh();
}

async function newEmail(){
  if(mailbox &&!confirm("Create new email? Current will be replaced.")) return;
  $("address").textContent="Creating email...";
  $("accountStatus").textContent="Creating mailbox...";
  try{
    await createAccount();
    $("address").textContent=mailbox;
    $("accountStatus").textContent="Mailbox ready";
    $("accountStatus").style.color="#57e8bd";
    messages=[]; renderEmpty();
    showStatus("New email created: "+mailbox,"success");
    await refreshInbox();
  }catch(e){
    $("accountStatus").textContent="Failed to create";
    showStatus(e.message,"error");
  }
}

async function refreshInbox(){
  if(!mailbox ||!token) return;
  $("accountStatus").textContent="Checking inbox...";
  try{
    const res = await fetch(API+"/messages",{headers:{Authorization:"Bearer "+token}});
    if(!res.ok) throw new Error("Auth failed - creating new");
    const data = await res.json();
    messages = data["hydra:member"] || [];
    $("accountStatus").textContent="Mailbox active - "+messages.length+" emails";
    $("accountStatus").style.color="#57e8bd";
    renderMessages();
    seconds=10;
  }catch(e){
    console.error(e);
    if(e.message.includes("Auth failed")){
      localStorage.clear();
      await newEmail();
    }else{
      $("accountStatus").textContent="Connection error";
      $("accountStatus").style.color="#ff829c";
    }
  }
}

function renderMessages(){
  const list=$("emailList");
  const readIds=JSON.parse(localStorage.getItem("mailtm_read")||"[]");
  const unread = messages.filter(m=>!readIds.includes(m.id)).length;
  $("unread").textContent=unread;
  if(!messages.length){renderEmpty();return;}
  list.innerHTML="";
  messages.forEach(m=>{
    const isRead=readIds.includes(m.id);
    const div=document.createElement("div");
    div.className="email"+(isRead?"":" unread");
    div.innerHTML=`<div class="email-top"><div class="sender">${isRead?"":'<span class="unread-dot"></span>'}${escapeHTML(m.from.address)}</div><div class="date">${escapeHTML(new Date(m.createdAt).toLocaleTimeString())}</div></div><div class="subject">${escapeHTML(m.subject||"(No subject)")}</div><div class="preview">${escapeHTML(m.intro||"Tap to open")}</div>`;
    div.onclick=()=>openMessage(m);
    list.appendChild(div);
  });
}
function renderEmpty(){
  $("emailList").innerHTML=`<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">Inbox empty</div><div class="empty-text">Send email to<br><strong style="color:#aab6ca">${escapeHTML(mailbox||"")}</strong><br><br>Code go appear here in 5-10 seconds.</div></div>`;
  $("unread").textContent="0";
}
async function openMessage(m){
  $("messageTitle").textContent=m.subject||"(No subject)";
  $("messageContent").innerHTML=`<div class="empty"><div class="loader"></div><div class="empty-title">Loading...</div></div>`;
  $("messageModal").classList.add("show");
  try{
    const res = await fetch(API+"/messages/"+m.id,{headers:{Authorization:"Bearer "+token}});
    const full = await res.json();
    const readIds=JSON.parse(localStorage.getItem("mailtm_read")||"[]");
    if(!readIds.includes(m.id)){readIds.push(m.id); localStorage.setItem("mailtm_read",JSON.stringify(readIds));}
    renderFull(full);
    renderMessages();
  }catch(e){
    $("messageContent").innerHTML=`<div class="empty">Failed to load</div>`;
  }
}
function renderFull(msg){
  const text = msg.text || msg.html?.replace(/<[^>]*>/g,"") || "No content";
  $("messageContent").innerHTML=`<div class="message-meta"><div class="meta"><div class="meta-label">From</div><div class="meta-value">${escapeHTML(msg.from.address)}</div></div><div class="meta"><div class="meta-label">Subject</div><div class="meta-value">${escapeHTML(msg.subject)}</div></div></div><div class="message-body">${escapeHTML(text)}</div><div class="message-buttons"><button onclick="navigator.clipboard.writeText('${escapeHTML(text).replace(/'/g,"\\'")}');showStatus('Copied!','success')">Copy Code</button><button onclick="deleteMessage('${msg.id}')">Delete</button></div>`;
}
async function deleteMessage(id){
  if(!confirm("Delete?")) return;
  await fetch(API+"/messages/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token}});
  messages=messages.filter(m=>m.id!==id);
  closeMessage(); renderMessages(); showStatus("Deleted","success");
}
function clearMailbox(){
  if(!confirm("Clear this email?")) return;
  localStorage.clear(); mailbox=null; token=null; messages=[]; stopAutoRefresh();
  $("address").textContent="Creating..."; newEmail(); startAutoRefresh();
}
async function copyAddress(){
  if(!mailbox) return;
  await navigator.clipboard.writeText(mailbox);
  showStatus("Copied: "+mailbox,"success");
}
function startAutoRefresh(){stopAutoRefresh();seconds=10;refreshTimer=setInterval(async()=>{seconds--;if(seconds<=0){seconds=10;await refreshInbox()} $("timer").textContent="Auto refresh: "+seconds+"s";},1000)}
function stopAutoRefresh(){if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}}
function closeMessage(){$("messageModal").classList.remove("show")}
document.addEventListener("DOMContentLoaded",initialize);
</script>
</body>
</html>
