<!DOCTYPE html>
<html>
<head>
  <title>InboxVeil - Free Disposable Email</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:#05050F;
      color:white;
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
      text-align:center;
      min-height:100vh;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(139,92,246,0.25) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(236,72,153,0.15) 0%, transparent 50%);
    }
    header{padding:20px 15px;display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:auto}
    .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
    .logo-box{background:linear-gradient(135deg,#8B5CF6,#EC4899);padding:10px 12px;border-radius:14px}
    .toggle{background:rgba(20,20,40,0.6);border:1px solid rgba(139,92,246,0.3);padding:10px 12px;border-radius:12px;font-size:20px;cursor:pointer}
    h1{font-size:32px;line-height:1.3;font-weight:800;margin:40px 0 15px}
    .gradient{background:linear-gradient(90deg,#8B5CF6,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .subtitle{color:#A0A0C0;max-width:600px;margin:0 auto 20px;font-size:16px;line-height:1.6}
    .features{color:#A78BFA;font-weight:600;margin:20px 0 40px;font-size:14px}
    
    .mailbox-box{
      background:rgba(15,15,30,0.8);
      border:1px solid rgba(139,92,246,0.4);
      border-radius:20px;
      padding:25px;
      max-width:520px;
      margin:0 auto;
      backdrop-filter:blur(10px);
      text-align:left
    }
    .label{color:#A78BFA;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .input-group{display:flex;gap:10px;margin-bottom:15px}
    input, select{
      background:#0A0A1A;
      border:1px solid rgba(139,92,246,0.4);
      color:white;
      padding:14px;
      border-radius:12px;
      font-size:15px;
      outline:none;
      width:100%
    }
    input:focus{border-color:#EC4899}
    .at{padding:14px 5px;font-size:18px;color:#888}
    .cta{
      background:linear-gradient(90deg,#8B5CF6,#EC4899);
      border:none;
      padding:16px;
      border-radius:14px;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      transition:0.3s
    }
    .cta:hover{transform:scale(1.02);box-shadow:0 0 30px rgba(139,92,246,0.5)}
    footer{margin-top:60px;color:#444;font-size:12px;padding:20px}
  </style>
</head>
<body>
  <header>
    <div class="logo"><div class="logo-box">✉️</div> InboxVeil</div>
    <div class="toggle" onclick="alert('Dark mode on!')">☀️</div>
  </header>

  <h1>Email API <span class="gradient">With<br>Custom Domain<br>Support</span></h1>
  
  <p class="subtitle">Create temporary email addresses instantly for testing and privacy.</p>
  
  <p class="features">REST API • Bring Your Own Domain • Auto-delete in up to 7 days</p>

  <div class="mailbox-box">
    <div class="label">>_ Enter your email address</div>
    <div class="input-group">
      <input type="text" id="username" placeholder="yourname">
      <span class="at">@</span>
      <select id="domain">
        <option>inboxveil.com</option>
        <option>inboxveil.io</option>
      </select>
    </div>
    <button class="cta" onclick="openMailbox()">✉️ Open My Mailbox →</button>
  </div>

  <footer>© 2026 InboxVeil. Built for privacy.</footer>

<script>
function openMailbox(){
  let user = document.getElementById('username').value || 'user'+Math.random().toString(36).slice(2,6);
  let domain = document.getElementById('domain').value;
  let email = user + '@' + domain;
  alert('Your Temp Email:\n\n' + email + '\n\nCopy am and use am anywhere!\n\nNote: This is a demo. Real inbox coming soon 🔥');
}
</script>
</body>
</html>
